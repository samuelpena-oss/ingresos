<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de gastos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="contenedor-principal">
        <section class="panel">
            <h1 class="titulo-principal">Administración de gastos</h1>
            <p class="subtitulo">Registra tus ingresos y gastos con claridad y estilo.</p>

            <form class="formulario" id="formulario-gastos">
                <div class="campo">
                    <label class="etiqueta" for="monto">Monto</label>
                    <input id="monto" type="text" placeholder="Ej: 250000">
                </div>

                <div class="campo">
                    <label class="etiqueta" for="fecha">Fecha</label>
                    <input id="fecha" type="date">
                </div>

                <div class="campo">
                    <label class="etiqueta" for="categoria">Categoría</label>
                    <select id="categoria" name="categoria">
                       
                    </select>
                </div>

                <div class="campo campo-acciones">
                    <button class="boton boton-ingreso" type="button">Ingreso</button>
                    <button class="boton boton-gasto" type="button">Gasto</button>
                </div>
            </form>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
