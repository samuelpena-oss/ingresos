<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos</title>
    <link rel="stylesheet" href="css/styls.css">
</head>
<body>
    <main class="app-shell">
        <section class="card">
            <h1>Registro de Gastos</h1>
            <form class="formulario">
                <div class="campo">
                    <label for="tipo">Tipo</label>
                    <select name="tipo" id="tipo">
                        <option value="ingresos">Ingresos</option>
                        <option value="gastos">Gastos</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="monto">Monto</label>
                    <input type="number" id="monto" name="monto" placeholder="Ingrese el monto" min="0" step="0.01">
                </div>
                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <select name="categoria" id="categoria">
                        <option value="alimentacion">Alimentación</option>
                        <option value="transporte">Transporte</option>
                        <option value="vivienda">Vivienda</option>
                        <option value="salud">Salud</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                <div class="botones">
                    <button type="button" id="btn-documentar">Documentar</button>
                    <button type="button" id="btn-ver-informacion">Ver registros</button>
                    <button type="submit">Registrar</button>
                </div>
            </form>
            <section class="documentacion" id="documentacion" hidden></section>
        </section>
    </main>
    <script>
        const formulario = document.querySelector('.formulario');
        const btnDocumentar = document.getElementById('btn-documentar');
        const documentacion = document.getElementById('documentacion');

        function mostrarDocumentacion(html) {
            documentacion.innerHTML = html;
            documentacion.hidden = false;
        }

        const btnVerInformacion = document.getElementById('btn-ver-informacion');

        btnDocumentar.addEventListener('click', () => {
            const tipo = document.getElementById('tipo').value;
            const monto = document.getElementById('monto').value;
            const categoria = document.getElementById('categoria').value;
            const fecha = document.getElementById('fecha').value;

            if (!monto || !fecha) {
                mostrarDocumentacion('<p class="error">Por favor completa el monto y la fecha antes de documentar.</p>');
                return;
            }

            mostrarDocumentacion(`
                <h2>Documento de ingreso</h2>
                <p><strong>Tipo:</strong> ${tipo}</p>
                <p><strong>Monto:</strong> $${parseFloat(monto).toFixed(2)}</p>
                <p><strong>Categoría:</strong> ${categoria}</p>
                <p><strong>Fecha:</strong> ${fecha}</p>
                <p><strong>Descripción:</strong> Información lista para guardar en la base de datos.</p>
            `);
        });

        btnVerInformacion.addEventListener('click', () => {
            window.location.href = '/informacion.html';
        });

        formulario.addEventListener('submit', async (event) => {
            event.preventDefault();

            const tipo = document.getElementById('tipo').value;
            const monto = document.getElementById('monto').value;
            const categoria = document.getElementById('categoria').value;
            const fecha = document.getElementById('fecha').value;

            if (!monto || !fecha) {
                mostrarDocumentacion('<p class="error">El monto y la fecha son obligatorios.</p>');
                return;
            }

            try {
                const response = await fetch('/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo, monto, categoria, fecha })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'No se pudo guardar el registro');
                }

                mostrarDocumentacion(`
                    <h2>Registro guardado</h2>
                    <p><strong>ID:</strong> ${result.transaccionId}</p>
                    <p><strong>Categoría:</strong> ${categoria}</p>
                    <p><strong>Monto:</strong> $${parseFloat(monto).toFixed(2)}</p>
                    <p><strong>Fecha:</strong> ${fecha}</p>
                    <p>Consulta la información completa en <a href="/informacion">la página de información</a>.</p>
                `);

                formulario.reset();
            } catch (error) {
                mostrarDocumentacion(`<p class="error">${error.message}</p>`);
            }
        });
    </script>
</body>
</html>
