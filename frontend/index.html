<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de gastos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="contenedor-principal">
        <section class="panel">
            <h1 class="titulo-principal">Administración de gastos</h1>
            <p class="subtitulo">Registra tus ingresos y gastos con claridad y estilo.</p>

            <form class="formulario" id="formulario-gastos">
                <input type="hidden" id="tipoMovimiento" name="tipo" value="gasto">

                <div class="campo">
                    <label class="etiqueta" for="monto">Monto</label>
                    <input id="monto" name="monto" type="number" step="0.01" min="0" placeholder="Ej: 250000" required>
                </div>

                <div class="campo">
                    <label class="etiqueta" for="fecha">Fecha</label>
                    <input id="fecha" name="fecha" type="date" required>
                </div>

                <div class="campo">
                    <label class="etiqueta" for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="alimentos">Alimentación</option>
                        <option value="vivienda">Vivienda</option>
                        <option value="transporte">Transporte</option>
                        <option value="salud">Salud</option>
                        <option value="entretenimiento">Entretenimiento</option>
                        <option value="educacion">Educación</option>
                        <option value="servicios">Servicios</option>
                    </select>
                </div>

                <div class="campo campo-acciones">
                    <button class="boton boton-ingreso" type="submit" data-tipo="ingreso">Ingreso</button>
                    <button class="boton boton-gasto" type="submit" data-tipo="gasto">Gasto</button>
                </div>
            </form>
        </section>

        <section class="panel panel-registros">
            <h2 class="titulo-seccion">Movimientos recientes</h2>
            <ul id="lista-movimientos" class="lista-movimientos"></ul>
        </section>
    </main>
    <script src="js/consumo.js"></script>
</body>
</html>
